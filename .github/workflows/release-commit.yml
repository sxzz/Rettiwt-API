name: Publish Any Commit
on: [push, pull_request]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - run: corepack enable
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: 'npm'

            # Installing dependencies
            - run: npm install

            - name: Build
              run: npm run build

            - run: npx pkg-pr-new publish
